name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_WORKING_DIR: environments/prod
  TF_VERSION: 1.7.5
  # Node.js 24 opt-in — required before June 2 2026 forced cutover
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write   # FIXED: was missing — caused 403 on PR comment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform init

      - name: Terraform Plan
        id: plan                     # FIXED: id was missing — PR comment had no output
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true      # FIXED: comment posts even when plan fails
        env:
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -no-color -out=tfplan

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan ${{ steps.plan.outcome == 'success' && '✅' || '❌' }} \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout || 'No plan output captured.' }}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} · \`${{ github.event_name }}\` · ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform init

      - name: Terraform Plan (saved)
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        # FIXED: saves plan then applies the saved file — guarantees what you
        # reviewed in the PR comment is exactly what gets applied
        run: |
          terraform plan -no-color -out=tfplan
          terraform apply tfplan
