name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_WORKING_DIR: environments/prod
  TF_VERSION: 1.7.5
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Init uses OCI Customer Secret Keys for the S3-compatible state backend.
      # configure-aws-credentials is intentionally NOT called before this step —
      # that action exports job-level env vars that cannot be overridden by step
      # env blocks, causing the AWS provider to receive OCI keys during init.
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.OCI_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION:    ap-south-1
          AWS_REGION:            ap-south-1
          TF_VAR_aws_region:     ap-south-1
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_oci2_tenancy_ocid:        ${{ secrets.OCI2_TENANCY_OCID }}
          TF_VAR_oci2_user_ocid:           ${{ secrets.OCI2_USER_OCID }}
          TF_VAR_oci2_fingerprint:         ${{ secrets.OCI2_FINGERPRINT }}
          TF_VAR_oci2_private_key:         ${{ secrets.OCI2_PRIVATE_KEY }}
          TF_VAR_oci2_region:              ${{ secrets.OCI2_REGION }}
          TF_VAR_oci2_availability_domain: ${{ secrets.OCI2_AVAILABILITY_DOMAIN }}
          TF_VAR_oci2_compartment_id:      ${{ secrets.OCI2_COMPARTMENT_ID }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform init -reconfigure

      # Plan uses real AWS creds — OCI state keys are no longer needed after init.
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ap-south-1
          AWS_REGION:            ap-south-1
          TF_VAR_aws_region:     ap-south-1
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_oci2_tenancy_ocid:        ${{ secrets.OCI2_TENANCY_OCID }}
          TF_VAR_oci2_user_ocid:           ${{ secrets.OCI2_USER_OCID }}
          TF_VAR_oci2_fingerprint:         ${{ secrets.OCI2_FINGERPRINT }}
          TF_VAR_oci2_private_key:         ${{ secrets.OCI2_PRIVATE_KEY }}
          TF_VAR_oci2_region:              ${{ secrets.OCI2_REGION }}
          TF_VAR_oci2_availability_domain: ${{ secrets.OCI2_AVAILABILITY_DOMAIN }}
          TF_VAR_oci2_compartment_id:      ${{ secrets.OCI2_COMPARTMENT_ID }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform plan -no-color -out=tfplan

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan ${{ steps.plan.outcome == 'success' && '✅' || '❌' }} \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout || 'No plan output captured.' }}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} · \`${{ github.event_name }}\` · ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.OCI_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION:    ap-south-1
          AWS_REGION:            ap-south-1
          TF_VAR_aws_region:     ap-south-1
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_oci2_tenancy_ocid:        ${{ secrets.OCI2_TENANCY_OCID }}
          TF_VAR_oci2_user_ocid:           ${{ secrets.OCI2_USER_OCID }}
          TF_VAR_oci2_fingerprint:         ${{ secrets.OCI2_FINGERPRINT }}
          TF_VAR_oci2_private_key:         ${{ secrets.OCI2_PRIVATE_KEY }}
          TF_VAR_oci2_region:              ${{ secrets.OCI2_REGION }}
          TF_VAR_oci2_availability_domain: ${{ secrets.OCI2_AVAILABILITY_DOMAIN }}
          TF_VAR_oci2_compartment_id:      ${{ secrets.OCI2_COMPARTMENT_ID }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: terraform init -reconfigure

      - name: Terraform Plan + Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ap-south-1
          AWS_REGION:            ap-south-1
          TF_VAR_aws_region:     ap-south-1
          TF_VAR_oci_tenancy_ocid:        ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_oci_user_ocid:           ${{ secrets.OCI_USER_OCID }}
          TF_VAR_oci_fingerprint:         ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_oci_private_key:         ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_oci_region:              ${{ secrets.OCI_REGION }}
          TF_VAR_oci2_tenancy_ocid:        ${{ secrets.OCI2_TENANCY_OCID }}
          TF_VAR_oci2_user_ocid:           ${{ secrets.OCI2_USER_OCID }}
          TF_VAR_oci2_fingerprint:         ${{ secrets.OCI2_FINGERPRINT }}
          TF_VAR_oci2_private_key:         ${{ secrets.OCI2_PRIVATE_KEY }}
          TF_VAR_oci2_region:              ${{ secrets.OCI2_REGION }}
          TF_VAR_oci2_availability_domain: ${{ secrets.OCI2_AVAILABILITY_DOMAIN }}
          TF_VAR_oci2_compartment_id:      ${{ secrets.OCI2_COMPARTMENT_ID }}
          TF_VAR_tailscale_auth_key:      ${{ secrets.TAILSCALE_AUTH_KEY }}
          TF_VAR_cloudflare_api_token:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id:      ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_azure_tenant_id:         ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_azure_client_id:         ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_azure_client_secret:     ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_azure_subscription_id:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email:             ${{ secrets.ALERT_EMAIL }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform apply tfplan
